<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Santiago</title>
  <meta name="description" content="Santiago's personal site — an Elden Ring Site of Grace for ML projects, piano, hobbies and contact." />
  <meta name="theme-color" content="#7fb0d9" />
  <meta property="og:title" content="Santiago" />
  <meta property="og:description" content="Rest at the Grace. ML projects, piano, hobbies, contact." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
</head>
<body>
  <noscript>
    <div style="padding:3rem;font-family:Georgia,serif;background:#0a0a0f;color:#e8c873;text-align:center;">
      Santiago's site needs JavaScript to light the Grace. Please enable it.
    </div>
  </noscript>

  <!-- Loading veil: a wink at Elden Ring's loading-screen tips -->
  <div id="loading-screen" role="status" aria-live="polite">
    <div class="loading-inner">
      <div class="loading-glyph" aria-hidden="true"></div>
      <p class="loading-tip" id="loading-tip">Tip: Vigor is a stat. So is coffee.</p>
    </div>
  </div>

  <div id="app">

    <!-- Ambient background: original stylized/low-poly art, no game assets.
         A Limgrave-ish meadow: sky, distant crags, golden trees, grass, a
         dirt path leading to the grace. Colors swap per Pass Time choice
         via CSS custom properties on <html data-time="...">. -->
    <div id="scene" aria-hidden="true">
      <svg class="pixel-scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <rect class="sky-band" x="0" y="0" width="320" height="26" fill="var(--sky-top)"/>
        <rect class="sky-band" x="0" y="26" width="320" height="26" fill="var(--sky-upper)"/>
        <rect class="sky-band" x="0" y="52" width="320" height="26" fill="var(--sky-mid)"/>
        <rect class="sky-band" x="0" y="78" width="320" height="26" fill="var(--sky-horizon)"/>

        <g class="clouds">
          <ellipse cx="60" cy="34" rx="18" ry="5" />
          <ellipse cx="74" cy="30" rx="12" ry="4" />
          <ellipse cx="245" cy="46" rx="20" ry="5" />
          <ellipse cx="230" cy="42" rx="11" ry="4" />
        </g>

        <circle class="sun-glow" cx="var(--sun-cx)" cy="var(--sun-cy)" r="24" fill="var(--sun-color)" opacity="0.25"/>
        <circle class="sun" cx="var(--sun-cx)" cy="var(--sun-cy)" r="12" fill="var(--sun-color)"/>

        <path class="mountains" d="M0 140 L0 115 L25 95 L55 118 L85 90 L115 112 L150 98 L185 115 L215 92 L250 113 L280 100 L320 118 L320 140 Z" fill="var(--mountain-color)"/>

        <rect class="grass-far" x="0" y="130" width="320" height="38" fill="var(--grass-far)"/>
        <rect class="grass-near" x="0" y="156" width="320" height="24" fill="var(--grass-near)"/>

        <path class="dirt-path" d="M148 145 L172 145 L190 180 L130 180 Z" fill="var(--path-color)"/>

        <g class="tree" transform="translate(54 118)">
          <rect x="-1.5" y="6" width="3" height="12" fill="var(--tree-trunk)"/>
          <circle cx="0" cy="2" r="9" fill="var(--tree-color)"/>
          <circle cx="-7" cy="7" r="6" fill="var(--tree-color)"/>
          <circle cx="7" cy="7" r="6" fill="var(--tree-color)"/>
        </g>
        <g class="tree" transform="translate(238 112) scale(0.85)">
          <rect x="-1.5" y="6" width="3" height="12" fill="var(--tree-trunk)"/>
          <circle cx="0" cy="2" r="9" fill="var(--tree-color)"/>
          <circle cx="-7" cy="7" r="6" fill="var(--tree-color)"/>
          <circle cx="7" cy="7" r="6" fill="var(--tree-color)"/>
        </g>
        <g class="tree" transform="translate(283 122) scale(0.7)">
          <rect x="-1.5" y="6" width="3" height="12" fill="var(--tree-trunk)"/>
          <circle cx="0" cy="2" r="9" fill="var(--tree-color)"/>
          <circle cx="-7" cy="7" r="6" fill="var(--tree-color)"/>
          <circle cx="7" cy="7" r="6" fill="var(--tree-color)"/>
        </g>

        <g class="flowers">
          <rect x="118" y="150" width="2.4" height="2.4" fill="#f6e9c9"/>
          <rect x="200" y="153" width="2.4" height="2.4" fill="#f2c94c"/>
          <rect x="90" y="162" width="2.4" height="2.4" fill="#e78a9a"/>
          <rect x="222" y="164" width="2.4" height="2.4" fill="#f6e9c9"/>
          <rect x="60" y="150" width="2.4" height="2.4" fill="#f2c94c"/>
          <rect x="255" y="158" width="2.4" height="2.4" fill="#e78a9a"/>
          <rect x="104" y="172" width="2.4" height="2.4" fill="#f2c94c"/>
          <rect x="205" y="174" width="2.4" height="2.4" fill="#f6e9c9"/>
        </g>
      </svg>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <canvas id="ember-canvas" aria-hidden="true"></canvas>

    <main id="stage">
      <section id="hero" aria-label="Santiago">

        <div id="grace-banner" class="grace-banner" aria-hidden="true">
          <span class="glyph">✦</span>
          <span class="banner-text">Grace Discovered</span>
          <span class="glyph">✦</span>
        </div>

        <button id="nameplate" class="nameplate" type="button" aria-label="Return to the Grace">
          <svg class="nameplate-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L12 22 M6 8 A6 6 0 0 0 18 8" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
          <span>Santiago</span>
        </button>

        <div class="title-lockup">
          <div class="title-rule" aria-hidden="true"></div>
          <h1 class="title-name">Santiago</h1>
          <div class="title-rule" aria-hidden="true"></div>
        </div>

        <div class="grace-plot">
          <div id="grace-symbol" class="grace-symbol" aria-hidden="true"></div>
          <div class="figure" aria-hidden="true"></div>
          <button id="rest-prompt" class="rest-prompt" type="button">
            <span class="prompt-glyph">✦</span>
            <span>Rest at the Grace</span>
          </button>
        </div>

        <p class="scroll-hint" aria-hidden="true">↕ interact</p>
      </section>

      <!-- Grace menu: populated by src/modules/menu.js from src/data/content.js -->
      <div id="grace-menu" class="grace-menu" role="dialog" aria-modal="true" aria-label="Grace options" aria-hidden="true"></div>

      <!-- Content panels: populated by src/modules/panels.js -->
      <div id="panel-overlay" class="panel-overlay" aria-hidden="true">
        <div id="panel-root" class="panel-root" role="dialog" aria-modal="true"></div>
      </div>
    </main>

    <div id="hud" class="hud" aria-hidden="true">
      <button id="audio-toggle" class="hud-btn" type="button" aria-label="Toggle ambient sound" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path class="wave" d="M17 8a6 6 0 0 1 0 8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div id="rune-counter" class="rune-counter" title="Runes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1" opacity="0.6"/></svg>
        <span id="rune-count">0</span>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
